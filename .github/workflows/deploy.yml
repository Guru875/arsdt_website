# =============================================================================
# ARSDT Website — CI/CD Deployment Pipeline
# =============================================================================
# Builds a static Next.js site and deploys it to Hostinger Shared Hosting
# via SSH + rsync on every push to the `main` branch.
#
# Required GitHub Secrets:
#   HOST         — Hostinger SSH hostname (e.g., ssh.example.hostinger.com)
#   PORT         — SSH port (e.g., 65002)
#   USERNAME     — Hostinger SSH username
#   SSH_PRIVATE_KEY  — Contents of the private SSH key (ed25519 or RSA)
# =============================================================================

name: 🚀 Build & Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Node
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install
      - name: 📦 Install dependencies
        run: npm ci

      # Build
      - name: 🏗️ Build site
        run: npm run build

      # Verify build
      - name: ✅ Verify build output
        run: |
          test -d out
          test "$(find out -type f | wc -l)" -gt 0
          echo "Build successful."

      # SSH
      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

      # Debug (helps if deployment fails)
      - name: 🔍 Verify remote directory
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" << 'EOF'
            echo "HOME=$HOME"
            pwd
            ls -ld "$HOME"
            ls -ld "$HOME/public_html"
            readlink -f "$HOME/public_html" || true
          EOF

      # Clean existing files
      - name: 🧹 Clean existing files
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" \
            "find \$HOME/public_html -mindepth 1 -maxdepth 1 ! -name '.htaccess' -exec rm -rf {} +"

      # Deploy
      - name: 🚀 Deploy with rsync
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            out/ \
            "$USERNAME@$HOST:$HOME/public_html/"

      # Verify deployment
      - name: ✅ Verify deployment
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" \
            "find \$HOME/public_html | head -20"

      # Cleanup
      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
