# =============================================================================
# ARSDT Website — CI/CD Deployment Pipeline
# =============================================================================
# Builds a static Next.js site and deploys it to Hostinger Shared Hosting
# via SSH + rsync on every push to the `main` branch.
#
# Required GitHub Secrets:
#   HOST         — Hostinger SSH hostname (e.g., ssh.example.hostinger.com)
#   PORT         — SSH port (e.g., 65002)
#   USERNAME     — Hostinger SSH username
#   SSH_PRIVATE_KEY  — Contents of the private SSH key (ed25519 or RSA)
# =============================================================================

name: 🚀 Build & Deploy to Hostinger

on:
  push:
    branches: [main]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Cancel any in-progress deployment when a new push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Fail the entire workflow immediately if any step fails
defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout the repository
      # -----------------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Node.js with dependency caching
      # -----------------------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Caches ~/.npm to speed up installs

      # -----------------------------------------------------------------------
      # 3. Install dependencies (clean install for reproducible builds)
      # -----------------------------------------------------------------------
      - name: 📦 Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # 4. Build the static site → generates `out/` folder
      # -----------------------------------------------------------------------
      - name: 🏗️ Build static site
        run: npm run build

      # -----------------------------------------------------------------------
      # 5. Verify the `out/` directory exists and is non-empty
      # -----------------------------------------------------------------------
      - name: ✅ Verify build output
        run: |
          if [ ! -d "out" ] || [ -z "$(ls -A out)" ]; then
            echo "❌ ERROR: 'out/' directory is missing or empty. Build may have failed."
            exit 1
          fi
          echo "✅ Build output verified — $(find out -type f | wc -l) files ready for deployment."

      # -----------------------------------------------------------------------
      # 6. Deploy to Hostinger via SSH + rsync
      # -----------------------------------------------------------------------
      - name: 🚀 Deploy to Hostinger
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # --- Setup SSH key ---
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # --- Add Hostinger's host key to known_hosts (prevents interactive prompt) ---
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # SSH shorthand for reuse
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $PORT $USERNAME@$HOST"

          # --- Resolve the real path of public_html (it's a symlink on Hostinger) ---
          DEPLOY_PATH=$($SSH_CMD "readlink -f ~/public_html")
          echo "📂 Resolved deploy path: $DEPLOY_PATH"

          # --- Clean old files from public_html (preserve .htaccess & .well-known) ---
          $SSH_CMD "cd $DEPLOY_PATH && find . -maxdepth 1 ! -name '.' ! -name '.htaccess' ! -name '.well-known' -exec rm -rf {} +"
          echo "🧹 Cleaned old files from server."

          # --- Upload new files via rsync ---
          # Flags:
          #   -rltvz  : Recursive, preserve links/times, verbose, compress
          #   --no-perms, --no-owner, --no-group : Don't try to set permissions
          #     (Hostinger's shared hosting handles permissions automatically)
          rsync -rltvz \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            out/ \
            "$USERNAME@$HOST:$DEPLOY_PATH/"

          echo "✅ Deployment complete!"

      # -----------------------------------------------------------------------
      # 7. Verify deployment (optional smoke test)
      # -----------------------------------------------------------------------
      - name: 🔍 Post-deploy verification
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          DEPLOY_PATH=$(ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" "readlink -f ~/public_html")
          FILE_COUNT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" \
            "$USERNAME@$HOST" \
            "find $DEPLOY_PATH -type f | wc -l")
          echo "✅ Deployment verified — $FILE_COUNT files on server."

      # -----------------------------------------------------------------------
      # 8. Cleanup SSH key
      # -----------------------------------------------------------------------
      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
