# =============================================================================
# ARSDT Website — CI/CD Deployment Pipeline
# =============================================================================
# Builds a static Next.js site and deploys it to Hostinger Shared Hosting
# via SSH + rsync on every push to the `main` branch.
#
# IMPORTANT: ~/public_html is a symlink to ANOTHER domain on Hostinger.
# The correct document root for arsdt.in is:
#   /home/u916301514/domains/arsdt.in/public_html
#
# Required GitHub Secrets:
#   HOST            — Hostinger SSH hostname
#   PORT            — SSH port
#   USERNAME        — Hostinger SSH username
#   SSH_PRIVATE_KEY — Contents of the private SSH key (ed25519 or RSA)
# =============================================================================

name: 🚀 Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# ──────────────────────────────────────────────────────────────────────────────
# The DEPLOY_PATH is the absolute path to arsdt.in's document root.
# Using an env var here so it's defined in ONE place, not scattered everywhere.
# ──────────────────────────────────────────────────────────────────────────────
env:
  DEPLOY_PATH: /home/u916301514/domains/arsdt.in/public_html

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup Node.js with npm cache
      # -----------------------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: 📦 Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # 4. Build static site → out/
      # -----------------------------------------------------------------------
      - name: 🏗️ Build static site
        run: npm run build

      # -----------------------------------------------------------------------
      # 5. Verify build output exists
      # -----------------------------------------------------------------------
      - name: ✅ Verify build output
        run: |
          if [ ! -d "out" ] || [ -z "$(ls -A out)" ]; then
            echo "❌ ERROR: 'out/' directory is missing or empty."
            exit 1
          fi
          echo "✅ Build verified — $(find out -type f | wc -l) files ready."

      # -----------------------------------------------------------------------
      # 6. Setup SSH connection
      # -----------------------------------------------------------------------
      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Debug: verify secrets are populated
          echo "HOST length: ${#HOST} chars"
          echo "PORT: $PORT"
          echo "Key size: $(wc -c < ~/.ssh/deploy_key) bytes"

          # Add host to known_hosts (|| true so it doesn't fail the step)
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>&1 || true

          # Fallback: skip host key check in CI
          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      # -----------------------------------------------------------------------
      # 7. Debug: verify server environment and paths
      # -----------------------------------------------------------------------
      - name: 🔍 Debug server environment
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "── Server Debug Info ──"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" bash <<'REMOTE'
            echo "whoami: $(whoami)"
            echo "pwd:    $(pwd)"
            echo ""
            echo "── Deploy target: $HOME/domains/arsdt.in/public_html ──"
            echo "Exists?  $([ -d $HOME/domains/arsdt.in/public_html ] && echo YES || echo NO)"
            echo "Type:    $(file $HOME/domains/arsdt.in/public_html)"
            ls -la $HOME/domains/arsdt.in/public_html/ | head -15
            echo ""
            echo "── WARNING: ~/public_html is a symlink (DO NOT deploy here) ──"
            ls -la ~/public_html 2>/dev/null || echo "~/public_html does not exist"
          REMOTE

      # -----------------------------------------------------------------------
      # 8. Clean old files from the CORRECT document root
      # -----------------------------------------------------------------------
      - name: 🧹 Clean old files on server
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "Cleaning: $DEPLOY_PATH"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" \
            "cd $DEPLOY_PATH && rm -rf ./*"
          echo "✅ Old files removed (hidden files like .htaccess preserved)."

      # -----------------------------------------------------------------------
      # 9. Upload out/ contents to the CORRECT document root via rsync
      # -----------------------------------------------------------------------
      - name: 🚀 Deploy to Hostinger
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "Deploying to: $DEPLOY_PATH"
          rsync -rltvz \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            out/ \
            "$USERNAME@$HOST:$DEPLOY_PATH/"
          echo "✅ Deployment complete!"

      # -----------------------------------------------------------------------
      # 10. Verify deployment
      # -----------------------------------------------------------------------
      - name: 🔍 Post-deploy verification
        continue-on-error: true
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "Listing deployed files at: $DEPLOY_PATH"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" \
            "ls -la $DEPLOY_PATH/ | head -25"
          FILE_COUNT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" "$USERNAME@$HOST" \
            "find $DEPLOY_PATH -type f | wc -l")
          echo "✅ Verified: $FILE_COUNT files deployed to arsdt.in"

      # -----------------------------------------------------------------------
      # 11. Cleanup SSH key from runner
      # -----------------------------------------------------------------------
      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
